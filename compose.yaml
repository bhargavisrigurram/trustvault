services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: vaultsecretpassword123
      POSTGRES_DB: trustvault
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://trustvault:vaultsecretpassword123@postgres:5432/trustvault
      SESSION_SECRET: c8f1e2d4a6b8c0e2f4a6b8c0e2f4a6b8c0e2f4a6b8c0e2f4a6b8c0e2f4a6b8c0
      CSRF_SECRET: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
      CORS_ORIGIN: http://localhost:3000
      STORAGE_FILES_DIR: /app/storage/files
      STORAGE_TEMP_DIR: /app/storage/temp
    volumes:
      - vault_storage:/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  vault_storage:
